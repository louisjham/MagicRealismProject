<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Magical Realism Invoker</title>
    <style>
      /* Transparent background so WebXR passthrough shows through */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      /* Debug overlay — visible in desktop mode, hidden in XR */
      #debug-ui {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 10;
      }
      #debug-ui.xr-active {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="debug-ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
